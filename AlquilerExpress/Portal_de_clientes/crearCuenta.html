<body>


    <main class="inicio crear-cuenta">

        <!-- PANEL IZQUIERDO -->
        <aside class="panel-marca">
            <img src="../Archivos_de_apoyo/Imagenes/Logos/AlquilerExpress_Logotipo.png"
                 alt="Logo AlquilerExpress" class="logo">

            <div class="marca-textos">
                <h2>Una nueva forma de viajar.</h2>
                <p>Elegancia, comodidad y confianza para cada trayecto.</p>
                <span>TEGUCIGALPA · HONDURAS</span>
            </div>
        </aside>

        <!-- PANEL DERECHO -->
        <section class="panel-formulario">
            <h1>CREAR CUENTA</h1>
            <p class="subtitulo">Completa tus datos para registrarte en AlquilerExpress.</p>

            <form id="formRegistro" method="post">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre"
                           autocomplete="given-name" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido"
                           autocomplete="family-name" required>
                </div>

                <div class="campo">
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" name="sexo" required>
                        <option value="" selected disabled>Seleccione una opción</option>
                        <option value="femenino">Femenino</option>
                        <option value="masculino">Masculino</option>
                        <option value="no_indica">Prefiero no indicarlo</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nacionalidad">Nacionalidad:</label>
                    <select id="nacionalidad" name="nacionalidad" required>
                        <option value="" selected disabled>Seleccione su nacionalidad</option>
                        <option value="hondurena">Hondureño/a</option>
                        <option value="extranjera">Extranjero/a</option>
                    </select>
                </div>

                <!-- DOCUMENTO HONDUREÑO -->
                <div class="campo" id="campoDNI" hidden>
                    <label for="dni">Número de identidad (DNI):</label>
                    <input type="text" id="dni" name="dni" placeholder="Ingrese los 13 dígitos"
                           inputmode="numeric" pattern="[0-9]{13}" maxlength="13"
                           autocomplete="off" disabled>
                </div>

                <!-- DOCUMENTOS EXTRANJEROS -->
                <div id="camposExtranjero" hidden>
                    <div class="campo">
                        <label for="pasaporte">Número de pasaporte:</label>
                        <input type="text" id="pasaporte" name="pasaporte"
                               placeholder="Ingrese su número de pasaporte" autocomplete="off" disabled>
                    </div>

                    </div>
                </div>

                <div class="campo">
                    <label for="licencia">Número de licencia de conducir:</label>
                    <input type="text" id="licencia" name="licencia"
                           placeholder="Ingrese su número de licencia" autocomplete="off" required>
                </div>

                <div class="campo">
                    <label for="telefono">Número de teléfono:</label>
                    <input type="tel" id="telefono" name="telefono"
                           placeholder="Ej. +504 9999-9999" autocomplete="tel" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo"
                           placeholder="ejemplo@correo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña:</label>
                    <div class="campo-contrasena">
                        <input type="password" id="contrasena" name="contrasena"
                               placeholder="Ingrese su contraseña" minlength="8"
                               autocomplete="new-password" required>
                        <button type="button" class="ver-contrasena"
                                aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icono-mostrar" width="22" height="22" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icono-ocultar" width="22" height="22" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-4 4.7"/>

                        </button>

                <!-- TÉRMINOS Y POLÍTICA DE PRIVACIDAD -->
                <div class="terminos">

                    <input
                        type="checkbox"
                        id="aceptarTerminos"
                        name="aceptarTerminos"
                        required
                    >

                    <label for="aceptarTerminos">
                        He leído y acepto los

                        <a
                            href="terminosPrivacidad.html"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Términos y condiciones y la Política de privacidad
                        </a>

                        de AlquilerExpress.
                    </label>

                </div>



                <button type="submit">Crear cuenta</button>
                <p id="mensajeRegistro" role="status" aria-live="polite"></p>
            </form>

            <div class="registro">
                <p>¿Ya tienes una cuenta?</p>
                <a href="inicio.html">Iniciar sesión</a>
            </div>

    </main>
