
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AlquilerExpress | Inicio de sesión</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../Archivos_de_apoyo/Clientes/inicio.css">

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="../Archivos_de_apoyo/Javascript/Clientes/contrasena_inicio_logo.js"></script>

</head>

<body>

    <div class="inicio">

        <!-- LOGOTIPO -->
        <img
            src="../Archivos_de_apoyo/Imagenes/Logos/AlquilerExpress_Logotipo.png"
            alt="Logo AlquilerExpress"
            class="logo"
        >

        <h1>BIENVENIDO/A</h1>

        <!-- FORMULARIO DE INICIO DE SESION -->
        <form action="login.php" method="post">

            <label for="usuario">Usuario:</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingrese su usuario"
                autocomplete="username"
                required
            >
            
            <label for="contrasena">Contraseña:</label>

            <div class="campo-contrasena">
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="ver-contrasena"
                    aria-label="Mostrar contraseña"
                    aria-pressed="false"
                >
                    <!-- OJO ABIERTO -->
                    <svg class="icono-mostrar"
                        width="22" height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <!-- OJO TACHADO -->
                    <svg class="icono-ocultar"
                        width="22" height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-4 4.7"/>
                        <path d="M6.5 6.5C3.5 8.5 2 12 2 12s3.5 7 10 7a10 10 0 0 0 5-1.3"/>
                        <path d="M10 10a3 3 0 0 0 4 4"/>
                        <path d="M3 3l18 18"/>
                    </svg>
                </button>
            </div>



            <button type="submit">
                Iniciar sesión
            </button>


        </form>

        <!-- CREAR CUENTA -->
        <div class="registro">
            <p>¿No tienes una cuenta?</p>

            <a href="crearCuenta.html">
                Crear cuenta
            </a>
        </div>

        <!-- ACCESO ADMINISTRADOR -->
        <a href="administrador.html" class="administrador">
            <span>Administrador</span>
        </a>

    </div>

</body>
</html>
